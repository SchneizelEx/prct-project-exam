name: Deploy to Apache server

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          # ไฟล์/โฟลเดอร์ที่ไม่ต้องการให้ deploy ทับของจริงบนเซิร์ฟเวอร์
          exclude: >-
            .git/ .github/ config/config.php storage/uploads/
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_port: ${{ secrets.SSH_PORT }}

# ต้องตั้งค่า GitHub Secrets ก่อนใช้งาน (Settings > Secrets and variables > Actions):
#   SSH_HOST     โฮสต์/IP ของเซิร์ฟเวอร์ Apache
#   SSH_USER     ผู้ใช้สำหรับ SSH
#   SSH_KEY      private key (PEM) สำหรับ SSH
#   SSH_PORT     พอร์ต SSH (ปกติ 22)
#   DEPLOY_PATH  path ปลายทางบนเซิร์ฟเวอร์ เช่น /var/www/present-registration
#
# หมายเหตุ: config/config.php และ storage/uploads/ จะไม่ถูก deploy ทับ ต้องตั้งค่า/สำรองข้อมูลบนเซิร์ฟเวอร์เอง
# การอัปเดตโครงสร้างฐานข้อมูล (sql/schema.sql) ต้องรันเองบนเซิร์ฟเวอร์ ไม่ได้รันอัตโนมัติจาก workflow นี้
